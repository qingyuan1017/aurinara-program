repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check . --no-cache
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check . --no-cache
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        always_run: true
