AWSTemplateFormatVersion: '2010-09-09'
Description: Aurinara ECS services, internal load balancer, roles, and disposable runner tasks.

Parameters:
  Environment: {Type: String, AllowedValues: [staging, production]}
  VpcId: {Type: AWS::EC2::VPC::Id}
  AppSubnetIds: {Type: List<AWS::EC2::Subnet::Id>}
  RunnerSubnetIds: {Type: List<AWS::EC2::Subnet::Id>}
  AlbSubnetIds: {Type: List<AWS::EC2::Subnet::Id>}
  AlbSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  ApiSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  WorkerSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  RunnerSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  IntegrationSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  ArtifactBucketName: {Type: String}
  AccessLogBucketName: {Type: String}
  DataKeyArn: {Type: String}
  DatabaseEndpoint: {Type: String}
  DatabaseSecretArn: {Type: String}
  ApplicationSecretArn: {Type: String}
  EfsFileSystemId: {Type: String}
  EfsAccessPointId: {Type: String}
  ProjectionQueueUrl: {Type: String}
  ProjectionQueueArn: {Type: String}
  QueueKeyArn: {Type: String}
  ApplicationImage: {Type: String, AllowedPattern: '^.+@sha256:[a-f0-9]{64}$'}
  MigrationApplicationImage: {Type: String, AllowedPattern: '^.+@sha256:[a-f0-9]{64}$'}
  ActivateServices: {Type: String, AllowedValues: ['true', 'false']}
  PythonRunnerImage: {Type: String, AllowedPattern: '^.+@sha256:[a-f0-9]{64}$'}
  RRunnerImage: {Type: String, AllowedPattern: '^.+@sha256:[a-f0-9]{64}$'}
  UserPoolClientId: {Type: String}
  JwtIssuer: {Type: String}
  JwtJwksUrl: {Type: String}
  ServiceClientId: {Type: String}
  ServiceClientSecretArn: {Type: String}
  ServiceTokenUrl: {Type: String}
  PlatformPrivateUrl: {Type: String}
  PlatformAuthorizationMode: {Type: String, AllowedValues: [shadow, enforced]}
  ApplicationOrigin: {Type: String}

Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  ServicesActive: !Equals [!Ref ActivateServices, 'true']

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub aurinara-${Environment}
      CapacityProviders: [FARGATE, FARGATE_SPOT]
      DefaultCapacityProviderStrategy:
        - {CapacityProvider: FARGATE, Weight: 1}
      ClusterSettings: [{Name: containerInsights, Value: enhanced}]
      Configuration:
        ExecuteCommandConfiguration: {Logging: NONE}

  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aurinara/${Environment}/application
      RetentionInDays: !If [IsProduction, 365, 30]
      KmsKeyId: !Ref DataKeyArn
  RunnerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aurinara/${Environment}/runner-lifecycle
      RetentionInDays: !If [IsProduction, 90, 14]
      KmsKeyId: !Ref DataKeyArn

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: ReadInjectedSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: [!Ref DatabaseSecretArn, !Ref ApplicationSecretArn, !Ref ServiceClientSecretArn]
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: !Ref DataKeyArn

  ApplicationTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: ImmutableArtifactAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketVersioning]
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !Ref DataKeyArn

  ProjectionTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: ConsumePlatformEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes]
                Resource: !Ref ProjectionQueueArn
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: !Ref QueueKeyArn

  ExecutionDispatcherTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: ArtifactAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !Ref DataKeyArn
        - PolicyName: DisposableRunnerControl
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ecs:RunTask, ecs:DescribeTasks, ecs:StopTask, ecs:ListTasks, ecs:TagResource]
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt TaskExecutionRole.Arn
                Condition: {StringEquals: {'iam:PassedToService': ecs-tasks.amazonaws.com}}

  InternalLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub aurinara-${Environment}-internal
      Scheme: internal
      Type: application
      IpAddressType: ipv4
      SecurityGroups: [!Ref AlbSecurityGroupId]
      Subnets: !Ref AlbSubnetIds
      LoadBalancerAttributes:
        - {Key: deletion_protection.enabled, Value: !If [IsProduction, 'true', 'false']}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
        - {Key: idle_timeout.timeout_seconds, Value: '300'}
        - {Key: access_logs.s3.enabled, Value: 'true'}
        - {Key: access_logs.s3.bucket, Value: !Ref AccessLogBucketName}
        - {Key: access_logs.s3.prefix, Value: alb}
  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub aurinara-${Environment}-api
      VpcId: !Ref VpcId
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health/ready
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}
  ApiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref InternalLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref ApiTargetGroup}]

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-${Environment}-api
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Volumes: [{Name: scratch}]
      ContainerDefinitions:
        - Name: application
          Image: !Ref ApplicationImage
          Essential: true
          ReadonlyRootFilesystem: true
          MountPoints: [{SourceVolume: scratch, ContainerPath: /tmp, ReadOnly: false}]
          PortMappings: [{ContainerPort: 8000, Protocol: tcp, Name: http}]
          Environment:
            - {Name: APP_ENV, Value: production}
            - {Name: APP_CORS_ALLOW_ORIGINS, Value: !Ref ApplicationOrigin}
            - {Name: DATABASE_URL, Value: ''}
            - {Name: DATABASE_HOST, Value: !Ref DatabaseEndpoint}
            - {Name: DATABASE_PORT, Value: '5432'}
            - {Name: DATABASE_NAME, Value: aurinara}
            - {Name: DATABASE_USER, Value: aurinara}
            - {Name: DATABASE_SSL_MODE, Value: require}
            - {Name: OBJECT_STORE_BUCKET, Value: !Ref ArtifactBucketName}
            - {Name: OBJECT_STORE_ENDPOINT, Value: ''}
            - {Name: OBJECT_STORE_ACCESS_KEY, Value: ''}
            - {Name: OBJECT_STORE_SECRET_KEY, Value: ''}
            - {Name: OBJECT_STORE_REGION, Value: !Ref AWS::Region}
            - {Name: OBJECT_STORE_PATH_STYLE, Value: 'false'}
            - {Name: PINNED_ASSET_LOCAL_FALLBACK, Value: 'false'}
            - {Name: JWT_ISSUER, Value: !Ref JwtIssuer}
            - {Name: JWT_JWKS_URL, Value: !Ref JwtJwksUrl}
            - {Name: JWT_AUDIENCE, Value: !Ref UserPoolClientId}
            - {Name: PLATFORM_CONTROL_PLANE_URL, Value: !Ref PlatformPrivateUrl}
            - {Name: PLATFORM_AUTHORIZATION_MODE, Value: !Ref PlatformAuthorizationMode}
            - {Name: PLATFORM_SERVICE_TOKEN_URL, Value: !Ref ServiceTokenUrl}
            - {Name: PLATFORM_SERVICE_CLIENT_ID, Value: !Ref ServiceClientId}
            - {Name: PLATFORM_SERVICE_AUDIENCE, Value: ''}
            - {Name: PLATFORM_SERVICE_RESOURCE, Value: ''}
            - {Name: PLATFORM_SERVICE_SCOPE, Value: aurinara-platform/service}
            - {Name: INTEGRATION_ALLOW_LOOPBACK_CALLBACKS, Value: 'false'}
            - {Name: EXECUTION_NETWORK_DISABLED, Value: 'true'}
            - {Name: PYTHON_RUNNER_IMAGE, Value: !Ref PythonRunnerImage}
            - {Name: R_RUNNER_IMAGE, Value: !Ref RRunnerImage}
          Secrets:
            - {Name: DATABASE_PASSWORD, ValueFrom: !Sub '${DatabaseSecretArn}:password::'}
            - {Name: PLATFORM_SERVICE_CLIENT_SECRET, ValueFrom: !Sub '${ServiceClientSecretArn}:client_secret::'}
            - {Name: INTEGRATION_SECRET_ENCRYPTION_KEY, ValueFrom: !Sub '${ApplicationSecretArn}:integration_encryption_key::'}
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: api}

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: ApiListener
    Properties:
      ServiceName: api
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !If [ServicesActive, !If [IsProduction, 2, 1], 0]
      LaunchType: FARGATE
      EnableExecuteCommand: false
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration: {AssignPublicIp: DISABLED, SecurityGroups: [!Ref ApiSecurityGroupId], Subnets: !Ref AppSubnetIds}
      LoadBalancers:
        - {ContainerName: application, ContainerPort: 8000, TargetGroupArn: !Ref ApiTargetGroup}

  BuildTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-${Environment}-build-worker
      Cpu: '2048'
      Memory: '4096'
      EphemeralStorage: {SizeInGiB: 100}
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Volumes: [{Name: scratch}]
      ContainerDefinitions:
        - Name: worker
          Image: !Ref ApplicationImage
          Command: [python, -m, workers.job_worker]
          Essential: true
          ReadonlyRootFilesystem: true
          MountPoints: [{SourceVolume: scratch, ContainerPath: /tmp, ReadOnly: false}]
          Environment: &WorkerEnvironment
            - {Name: APP_ENV, Value: production}
            - {Name: DATABASE_URL, Value: ''}
            - {Name: DATABASE_HOST, Value: !Ref DatabaseEndpoint}
            - {Name: DATABASE_PORT, Value: '5432'}
            - {Name: DATABASE_NAME, Value: aurinara}
            - {Name: DATABASE_USER, Value: aurinara}
            - {Name: DATABASE_SSL_MODE, Value: require}
            - {Name: OBJECT_STORE_BUCKET, Value: !Ref ArtifactBucketName}
            - {Name: OBJECT_STORE_ENDPOINT, Value: ''}
            - {Name: OBJECT_STORE_ACCESS_KEY, Value: ''}
            - {Name: OBJECT_STORE_SECRET_KEY, Value: ''}
            - {Name: OBJECT_STORE_REGION, Value: !Ref AWS::Region}
            - {Name: OBJECT_STORE_PATH_STYLE, Value: 'false'}
            - {Name: PINNED_ASSET_LOCAL_FALLBACK, Value: 'false'}
            - {Name: PLATFORM_CONTROL_PLANE_URL, Value: !Ref PlatformPrivateUrl}
            - {Name: PLATFORM_AUTHORIZATION_MODE, Value: !Ref PlatformAuthorizationMode}
            - {Name: PLATFORM_SERVICE_TOKEN_URL, Value: !Ref ServiceTokenUrl}
            - {Name: PLATFORM_SERVICE_CLIENT_ID, Value: !Ref ServiceClientId}
            - {Name: PLATFORM_SERVICE_AUDIENCE, Value: ''}
            - {Name: PLATFORM_SERVICE_RESOURCE, Value: ''}
            - {Name: PLATFORM_SERVICE_SCOPE, Value: aurinara-platform/service}
            - {Name: INTEGRATION_ALLOW_LOOPBACK_CALLBACKS, Value: 'false'}
            - {Name: EXECUTION_NETWORK_DISABLED, Value: 'true'}
            - {Name: PYTHON_RUNNER_IMAGE, Value: !Ref PythonRunnerImage}
            - {Name: R_RUNNER_IMAGE, Value: !Ref RRunnerImage}
          Secrets: &ApplicationSecrets
            - {Name: DATABASE_PASSWORD, ValueFrom: !Sub '${DatabaseSecretArn}:password::'}
            - {Name: PLATFORM_SERVICE_CLIENT_SECRET, ValueFrom: !Sub '${ServiceClientSecretArn}:client_secret::'}
            - {Name: INTEGRATION_SECRET_ENCRYPTION_KEY, ValueFrom: !Sub '${ApplicationSecretArn}:integration_encryption_key::'}
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: build}
  BuildService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: build-worker
      Cluster: !Ref Cluster
      TaskDefinition: !Ref BuildTaskDefinition
      DesiredCount: !If [ServicesActive, !If [IsProduction, 2, 1], 0]
      LaunchType: FARGATE
      DeploymentConfiguration: {DeploymentCircuitBreaker: {Enable: true, Rollback: true}, MinimumHealthyPercent: 50, MaximumPercent: 200}
      NetworkConfiguration:
        AwsvpcConfiguration: {AssignPublicIp: DISABLED, SecurityGroups: [!Ref WorkerSecurityGroupId], Subnets: !Ref AppSubnetIds}

  PythonRunnerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties: &RunnerTask
      Family: !Sub aurinara-${Environment}-python-runner
      Cpu: '2048'
      Memory: '4096'
      EphemeralStorage: {SizeInGiB: 100}
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Volumes:
        - Name: workspace
          EFSVolumeConfiguration:
            FilesystemId: !Ref EfsFileSystemId
            TransitEncryption: ENABLED
            RootDirectory: /
            AuthorizationConfig: {AccessPointId: !Ref EfsAccessPointId, IAM: DISABLED}
      ContainerDefinitions:
        - Name: runner
          Image: !Ref PythonRunnerImage
          Essential: true
          User: '10001'
          ReadonlyRootFilesystem: true
          MountPoints: [{SourceVolume: workspace, ContainerPath: /workspace, ReadOnly: false}]
          LinuxParameters:
            InitProcessEnabled: true
            Capabilities: {Drop: [ALL]}
            Tmpfs: [{ContainerPath: /tmp, Size: 1024, MountOptions: [rw, noexec, nosuid, nodev]}]
          Ulimits:
            - {Name: nproc, SoftLimit: 64, HardLimit: 64}
            - {Name: nofile, SoftLimit: 1024, HardLimit: 1024}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref RunnerLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: python}

  RRunnerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-${Environment}-r-runner
      Cpu: '2048'
      Memory: '4096'
      EphemeralStorage: {SizeInGiB: 100}
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      Volumes:
        - Name: workspace
          EFSVolumeConfiguration:
            FilesystemId: !Ref EfsFileSystemId
            TransitEncryption: ENABLED
            RootDirectory: /
            AuthorizationConfig: {AccessPointId: !Ref EfsAccessPointId, IAM: DISABLED}
      ContainerDefinitions:
        - Name: runner
          Image: !Ref RRunnerImage
          Essential: true
          User: '10001'
          ReadonlyRootFilesystem: true
          MountPoints: [{SourceVolume: workspace, ContainerPath: /workspace, ReadOnly: false}]
          LinuxParameters:
            InitProcessEnabled: true
            Capabilities: {Drop: [ALL]}
            Tmpfs: [{ContainerPath: /tmp, Size: 1024, MountOptions: [rw, noexec, nosuid, nodev]}]
          Ulimits:
            - {Name: nproc, SoftLimit: 64, HardLimit: 64}
            - {Name: nofile, SoftLimit: 1024, HardLimit: 1024}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref RunnerLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: r}

  ExecutionDispatcherTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-${Environment}-execution-dispatcher
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ExecutionDispatcherTaskRole.Arn
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Volumes:
        - Name: workspace
          EFSVolumeConfiguration:
            FilesystemId: !Ref EfsFileSystemId
            TransitEncryption: ENABLED
            RootDirectory: /
            AuthorizationConfig: {AccessPointId: !Ref EfsAccessPointId, IAM: DISABLED}
        - {Name: scratch}
      ContainerDefinitions:
        - Name: dispatcher
          Image: !Ref ApplicationImage
          Command: [python, -m, workers.execution_dispatcher]
          Essential: true
          ReadonlyRootFilesystem: true
          MountPoints:
            - {SourceVolume: workspace, ContainerPath: /mnt/aurinara-execution, ReadOnly: false}
            - {SourceVolume: scratch, ContainerPath: /tmp, ReadOnly: false}
          Environment:
            - {Name: APP_ENV, Value: production}
            - {Name: DATABASE_URL, Value: ''}
            - {Name: DATABASE_HOST, Value: !Ref DatabaseEndpoint}
            - {Name: DATABASE_PORT, Value: '5432'}
            - {Name: DATABASE_NAME, Value: aurinara}
            - {Name: DATABASE_USER, Value: aurinara}
            - {Name: DATABASE_SSL_MODE, Value: require}
            - {Name: OBJECT_STORE_BUCKET, Value: !Ref ArtifactBucketName}
            - {Name: OBJECT_STORE_ENDPOINT, Value: ''}
            - {Name: OBJECT_STORE_ACCESS_KEY, Value: ''}
            - {Name: OBJECT_STORE_SECRET_KEY, Value: ''}
            - {Name: OBJECT_STORE_REGION, Value: !Ref AWS::Region}
            - {Name: OBJECT_STORE_PATH_STYLE, Value: 'false'}
            - {Name: PINNED_ASSET_LOCAL_FALLBACK, Value: 'false'}
            - {Name: PLATFORM_CONTROL_PLANE_URL, Value: !Ref PlatformPrivateUrl}
            - {Name: PLATFORM_AUTHORIZATION_MODE, Value: !Ref PlatformAuthorizationMode}
            - {Name: PLATFORM_SERVICE_TOKEN_URL, Value: !Ref ServiceTokenUrl}
            - {Name: PLATFORM_SERVICE_CLIENT_ID, Value: !Ref ServiceClientId}
            - {Name: PLATFORM_SERVICE_AUDIENCE, Value: ''}
            - {Name: PLATFORM_SERVICE_RESOURCE, Value: ''}
            - {Name: PLATFORM_SERVICE_SCOPE, Value: aurinara-platform/service}
            - {Name: INTEGRATION_ALLOW_LOOPBACK_CALLBACKS, Value: 'false'}
            - {Name: EXECUTION_NETWORK_DISABLED, Value: 'true'}
            - {Name: PYTHON_RUNNER_IMAGE, Value: !Ref PythonRunnerImage}
            - {Name: R_RUNNER_IMAGE, Value: !Ref RRunnerImage}
            - {Name: EXECUTOR_ADAPTER, Value: ecs}
            - {Name: EXECUTION_WORKSPACE_ROOT, Value: /mnt/aurinara-execution}
            - {Name: ECS_CLUSTER_ARN, Value: !GetAtt Cluster.Arn}
            - {Name: ECS_PYTHON_TASK_DEFINITION, Value: !Ref PythonRunnerTaskDefinition}
            - {Name: ECS_R_TASK_DEFINITION, Value: !Ref RRunnerTaskDefinition}
            - {Name: ECS_SUBNET_IDS, Value: !Join [',', !Ref RunnerSubnetIds]}
            - {Name: ECS_SECURITY_GROUP_IDS, Value: !Ref RunnerSecurityGroupId}
            - {Name: ECS_ASSIGN_PUBLIC_IP, Value: 'false'}
          Secrets: *ApplicationSecrets
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: execution}
  ExecutionDispatcherService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: execution-dispatcher
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ExecutionDispatcherTaskDefinition
      DesiredCount: !If [ServicesActive, 1, 0]
      LaunchType: FARGATE
      DeploymentConfiguration: {DeploymentCircuitBreaker: {Enable: true, Rollback: true}, MinimumHealthyPercent: 0, MaximumPercent: 200}
      NetworkConfiguration:
        AwsvpcConfiguration: {AssignPublicIp: DISABLED, SecurityGroups: [!Ref WorkerSecurityGroupId], Subnets: !Ref AppSubnetIds}

  IntegrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-${Environment}-integration-dispatcher
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Volumes: [{Name: scratch}]
      ContainerDefinitions:
        - Name: integration
          Image: !Ref ApplicationImage
          Command: [python, -m, workers.integration_dispatcher]
          Essential: true
          ReadonlyRootFilesystem: true
          MountPoints: [{SourceVolume: scratch, ContainerPath: /tmp, ReadOnly: false}]
          Environment: *WorkerEnvironment
          Secrets: *ApplicationSecrets
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: integration}
  IntegrationService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: integration-dispatcher
      Cluster: !Ref Cluster
      TaskDefinition: !Ref IntegrationTaskDefinition
      DesiredCount: !If [ServicesActive, 1, 0]
      LaunchType: FARGATE
      DeploymentConfiguration: {DeploymentCircuitBreaker: {Enable: true, Rollback: true}, MinimumHealthyPercent: 0, MaximumPercent: 100}
      NetworkConfiguration:
        AwsvpcConfiguration: {AssignPublicIp: DISABLED, SecurityGroups: [!Ref IntegrationSecurityGroupId], Subnets: !Ref AppSubnetIds}

  ProjectionTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-${Environment}-projection-worker
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ProjectionTaskRole.Arn
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Volumes: [{Name: scratch}]
      ContainerDefinitions:
        - Name: projection
          Image: !Ref ApplicationImage
          Command: [python, -m, workers.platform_projection_worker]
          Essential: true
          ReadonlyRootFilesystem: true
          MountPoints: [{SourceVolume: scratch, ContainerPath: /tmp, ReadOnly: false}]
          Environment:
            - {Name: APP_ENV, Value: production}
            - {Name: DATABASE_URL, Value: ''}
            - {Name: DATABASE_HOST, Value: !Ref DatabaseEndpoint}
            - {Name: DATABASE_PORT, Value: '5432'}
            - {Name: DATABASE_NAME, Value: aurinara}
            - {Name: DATABASE_USER, Value: aurinara}
            - {Name: DATABASE_SSL_MODE, Value: require}
            - {Name: OBJECT_STORE_BUCKET, Value: !Ref ArtifactBucketName}
            - {Name: OBJECT_STORE_ENDPOINT, Value: ''}
            - {Name: OBJECT_STORE_ACCESS_KEY, Value: ''}
            - {Name: OBJECT_STORE_SECRET_KEY, Value: ''}
            - {Name: OBJECT_STORE_REGION, Value: !Ref AWS::Region}
            - {Name: OBJECT_STORE_PATH_STYLE, Value: 'false'}
            - {Name: PINNED_ASSET_LOCAL_FALLBACK, Value: 'false'}
            - {Name: PLATFORM_CONTROL_PLANE_URL, Value: !Ref PlatformPrivateUrl}
            - {Name: PLATFORM_AUTHORIZATION_MODE, Value: !Ref PlatformAuthorizationMode}
            - {Name: PLATFORM_SERVICE_TOKEN_URL, Value: !Ref ServiceTokenUrl}
            - {Name: PLATFORM_SERVICE_CLIENT_ID, Value: !Ref ServiceClientId}
            - {Name: PLATFORM_SERVICE_AUDIENCE, Value: ''}
            - {Name: PLATFORM_SERVICE_RESOURCE, Value: ''}
            - {Name: PLATFORM_SERVICE_SCOPE, Value: aurinara-platform/service}
            - {Name: INTEGRATION_ALLOW_LOOPBACK_CALLBACKS, Value: 'false'}
            - {Name: EXECUTION_NETWORK_DISABLED, Value: 'true'}
            - {Name: PYTHON_RUNNER_IMAGE, Value: !Ref PythonRunnerImage}
            - {Name: R_RUNNER_IMAGE, Value: !Ref RRunnerImage}
            - {Name: PLATFORM_EVENT_QUEUE_URL, Value: !Ref ProjectionQueueUrl}
            - {Name: PLATFORM_EVENT_REGION, Value: !Ref AWS::Region}
          Secrets: *ApplicationSecrets
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: projection}
  ProjectionService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: projection-worker
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ProjectionTaskDefinition
      DesiredCount: !If [ServicesActive, !If [IsProduction, 2, 1], 0]
      LaunchType: FARGATE
      DeploymentConfiguration: {DeploymentCircuitBreaker: {Enable: true, Rollback: true}, MinimumHealthyPercent: 50, MaximumPercent: 200}
      NetworkConfiguration:
        AwsvpcConfiguration: {AssignPublicIp: DISABLED, SecurityGroups: [!Ref WorkerSecurityGroupId], Subnets: !Ref AppSubnetIds}

  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-${Environment}-migration
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Volumes: [{Name: scratch}]
      ContainerDefinitions:
        - Name: migration
          Image: !Ref MigrationApplicationImage
          Command: [sh, -c, 'alembic upgrade head && python -m app.catalog_seed && python -m app.cdisc_registry publish-assets --verify-existing']
          Essential: true
          ReadonlyRootFilesystem: true
          MountPoints: [{SourceVolume: scratch, ContainerPath: /tmp, ReadOnly: false}]
          Environment: *WorkerEnvironment
          Secrets: *ApplicationSecrets
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: migration}

  BuildScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MinCapacity: !If [ServicesActive, !If [IsProduction, 2, 1], 0]
      MaxCapacity: 10
      ResourceId: !Join ['/', [service, !Ref Cluster, !GetAtt BuildService.Name]]
      RoleARN: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  BuildCpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: build-worker-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref BuildScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification: {PredefinedMetricType: ECSServiceAverageCPUUtilization}
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
  BuildQueueScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: build-worker-queue
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref BuildScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 1
        CustomizedMetricSpecification:
          Namespace: Aurinara
          MetricName: QueuedJobs
          Statistic: Average
          Unit: Count
          Dimensions:
            - {Name: Environment, Value: !Ref Environment}
            - {Name: WorkerQueue, Value: build}
        ScaleInCooldown: 300
        ScaleOutCooldown: 30

  ExecutionScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MinCapacity: !If [ServicesActive, 1, 0]
      MaxCapacity: 10
      ResourceId: !Join ['/', [service, !Ref Cluster, !GetAtt ExecutionDispatcherService.Name]]
      RoleARN: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  ExecutionCpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: execution-dispatcher-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ExecutionScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 50
        PredefinedMetricSpecification: {PredefinedMetricType: ECSServiceAverageCPUUtilization}
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
  ExecutionQueueScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: execution-dispatcher-queue
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ExecutionScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 1
        CustomizedMetricSpecification:
          Namespace: Aurinara
          MetricName: QueuedJobs
          Statistic: Average
          Unit: Count
          Dimensions:
            - {Name: Environment, Value: !Ref Environment}
            - {Name: WorkerQueue, Value: execution}
        ScaleInCooldown: 300
        ScaleOutCooldown: 30

Outputs:
  ClusterName: {Value: !Ref Cluster}
  ClusterArn: {Value: !GetAtt Cluster.Arn}
  ApiServiceName: {Value: !GetAtt ApiService.Name}
  AlbArn: {Value: !Ref InternalLoadBalancer}
  AlbDnsName: {Value: !GetAtt InternalLoadBalancer.DNSName}
  AlbFullName: {Value: !GetAtt InternalLoadBalancer.LoadBalancerFullName}
  ApiTargetGroupFullName: {Value: !GetAtt ApiTargetGroup.TargetGroupFullName}
  MigrationTaskDefinitionArn: {Value: !Ref MigrationTaskDefinition}
  PythonRunnerTaskDefinitionArn: {Value: !Ref PythonRunnerTaskDefinition}
  RRunnerTaskDefinitionArn: {Value: !Ref RRunnerTaskDefinition}
