AWSTemplateFormatVersion: '2010-09-09'
Description: Aurinara security boundaries in the shared platform VPC.

Parameters:
  Environment: {Type: String, AllowedValues: [staging, production]}
  VpcId: {Type: AWS::EC2::VPC::Id}
  VpcCidr: {Type: String}
  AppSubnetIds: {Type: CommaDelimitedList}
  RunnerSubnetIds: {Type: CommaDelimitedList}
  DataSubnetIds: {Type: CommaDelimitedList}
  DeploymentProfile: {Type: String, AllowedValues: [standard, budget], Default: standard}
  SharedAlbSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}

Conditions:
  IsBudget: !Equals [!Ref DeploymentProfile, budget]
  IsStandard: !Not [!Condition IsBudget]

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsStandard
    Properties:
      GroupDescription: CloudFront VPC origin to the Aurinara internal ALB
      VpcId: !Ref VpcId
      Tags: [{Key: Name, Value: !Sub 'aurinara-${Environment}-alb'}]
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref VpcCidr}
  CloudFrontAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: IsStandard
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourcePrefixListId: pl-3b927c52
      Description: CloudFront origin-facing managed prefix list for us-east-1
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurinara API
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !If [IsBudget, !Ref SharedAlbSecurityGroupId, !Ref AlbSecurityGroup]
  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties: {GroupDescription: Aurinara workers, VpcId: !Ref VpcId}
  IntegrationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurinara outbound integration workers
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
  IntegrationDnsUdp:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref IntegrationSecurityGroup, IpProtocol: udp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr}
  IntegrationDnsTcp:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref IntegrationSecurityGroup, IpProtocol: tcp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr}
  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurinara isolated runner tasks
      VpcId: !Ref VpcId
      SecurityGroupEgress: []
  RunnerHttpsWithoutInternetRoute:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref RunnerSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
  RunnerDnsUdp:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref RunnerSecurityGroup, IpProtocol: udp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr}
  RunnerDnsTcp:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref RunnerSecurityGroup, IpProtocol: tcp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr}
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurinara PostgreSQL
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref ApiSecurityGroup}
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref WorkerSecurityGroup}
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref IntegrationSecurityGroup}
  IntegrationDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref IntegrationSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref DatabaseSecurityGroup}
  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurinara execution workspace
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 2049, ToPort: 2049, SourceSecurityGroupId: !Ref WorkerSecurityGroup}
        - {IpProtocol: tcp, FromPort: 2049, ToPort: 2049, SourceSecurityGroupId: !Ref RunnerSecurityGroup}
  RunnerToEfs:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref RunnerSecurityGroup, IpProtocol: tcp, FromPort: 2049, ToPort: 2049, DestinationSecurityGroupId: !Ref EfsSecurityGroup}
Outputs:
  VpcId: {Value: !Ref VpcId}
  VpcCidr: {Value: !Ref VpcCidr}
  AppSubnetIds: {Value: !Join [',', !Ref AppSubnetIds]}
  RunnerSubnetIds: {Value: !Join [',', !Ref RunnerSubnetIds]}
  DataSubnetIds: {Value: !Join [',', !Ref DataSubnetIds]}
  PublicSubnetIds: {Value: !Join [',', !Ref AppSubnetIds]}
  AlbSecurityGroupId: {Value: !If [IsBudget, !Ref SharedAlbSecurityGroupId, !Ref AlbSecurityGroup]}
  ApiSecurityGroupId: {Value: !Ref ApiSecurityGroup}
  WorkerSecurityGroupId: {Value: !Ref WorkerSecurityGroup}
  RunnerSecurityGroupId: {Value: !Ref RunnerSecurityGroup}
  IntegrationSecurityGroupId: {Value: !Ref IntegrationSecurityGroup}
  DatabaseSecurityGroupId: {Value: !Ref DatabaseSecurityGroup}
  EfsSecurityGroupId: {Value: !Ref EfsSecurityGroup}
