AWSTemplateFormatVersion: '2010-09-09'
Description: Aurinara CloudFront, private SPA origin, VPC API origin, WAF, DNS, and access logs.

Parameters:
  Environment: {Type: String, AllowedValues: [staging, production]}
  ApplicationDomain: {Type: String}
  HostedZoneId: {Type: AWS::Route53::HostedZone::Id}
  CertificateArn: {Type: String}
  FrontendBucketName: {Type: String}
  FrontendBucketRegionalDomainName: {Type: String}
  AccessLogBucketDomainName: {Type: String}
  AlbArn: {Type: String}
  AlbDnsName: {Type: String}

Resources:
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub aurinara-${Environment}-edge
      Scope: CLOUDFRONT
      DefaultAction: {Allow: {}}
      VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: !Sub 'aurinara-${Environment}-waf', SampledRequestsEnabled: true}
      Rules:
        - Name: AmazonIpReputation
          Priority: 0
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: ip-reputation, SampledRequestsEnabled: true}
        - Name: CommonThreats
          Priority: 1
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY
                  ActionToUse: {Count: {}}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: common-threats, SampledRequestsEnabled: true}
        - Name: KnownBadInputs
          Priority: 2
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: bad-inputs, SampledRequestsEnabled: true}
        - Name: PerIpRateLimit
          Priority: 10
          Action: {Block: {}}
          Statement: {RateBasedStatement: {AggregateKeyType: IP, Limit: 3000, EvaluationWindowSec: 300}}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: rate-limit, SampledRequestsEnabled: true}

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub aurinara-${Environment}-spa
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ApiVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub aurinara-${Environment}-api
        Arn: !Ref AlbArn
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
        OriginSSLProtocols: [TLSv1.2]

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub aurinara-${Environment}-spa-rewrite
      AutoPublish: true
      FunctionConfig: {Comment: Rewrite extensionless SPA routes to index.html, Runtime: cloudfront-js-2.0}
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.startsWith('/api/') || request.uri.startsWith('/health/')) return request;
          if (!request.uri.includes('.')) request.uri = '/index.html';
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Aurinara ${Environment}
        Aliases: [!Ref ApplicationDomain]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        WebACLId: !GetAtt WebAcl.Arn
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
        Logging:
          Bucket: !Ref AccessLogBucketDomainName
          IncludeCookies: false
          Prefix: cloudfront/
        Origins:
          - Id: spa
            DomainName: !Ref FrontendBucketRegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
          - Id: api
            DomainName: !Ref AlbDnsName
            VpcOriginConfig: {VpcOriginId: !GetAtt ApiVpcOrigin.Id}
        DefaultCacheBehavior:
          TargetOriginId: spa
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - {EventType: viewer-request, FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN}
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: false
            CachePolicyId: 413f160b-54f8-4c6d-8b13-ae1f91d2dfc1
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /health/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: false
            CachePolicyId: 413f160b-54f8-4c6d-8b13-ae1f91d2dfc1
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${FrontendBucketName}
              - !Sub arn:${AWS::Partition}:s3:::${FrontendBucketName}/*
            Condition: {Bool: {'aws:SecureTransport': false}}
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${FrontendBucketName}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  DnsA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApplicationDomain
      Type: A
      AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false}
  DnsAaaa:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApplicationDomain
      Type: AAAA
      AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false}

Outputs:
  DistributionId: {Value: !Ref Distribution}
  DistributionDomainName: {Value: !GetAtt Distribution.DomainName}
  WebAclArn: {Value: !GetAtt WebAcl.Arn}
