AWSTemplateFormatVersion: '2010-09-09'
Description: Account-level bootstrap for Aurinara GitHub delivery and immutable ECR images.

Parameters:
  GitHubOwner:
    Type: String
  GitHubRepository:
    Type: String
  DeploymentBranch:
    Type: String
    Default: master
  GitHubOidcProviderArn:
    Type: String

Resources:
  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aurinara-github-deployment
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:repository: !Sub ${GitHubOwner}/${GitHubRepository}
                token.actions.githubusercontent.com:ref: !Sub refs/heads/${DeploymentBranch}
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}/${GitHubRepository}:environment:staging
                  - !Sub repo:${GitHubOwner}/${GitHubRepository}:environment:production
      Policies:
        - PolicyName: cloudformation-deployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:Describe*
                  - cloudformation:Detect*
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                  - cloudformation:List*
                  - cloudformation:SetStackPolicy
                  - cloudformation:UpdateStack
                  - cloudformation:ValidateTemplate
                  - cloudformation:UpdateTerminationProtection
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetAuthorizationToken
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${TemplateBucket.Arn}/*
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RunTask
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: '*'
                Condition: {StringEquals: {'iam:PassedToService': ecs-tasks.amazonaws.com}}
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !Sub arn:${AWS::Partition}:s3:::aurinara-*
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::aurinara-*/*
              - Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub s3.${AWS::Region}.amazonaws.com
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation]
                Resource: '*'
              - Effect: Allow
                Action: [rds:CreateDBSnapshot, rds:DescribeDBSnapshots]
                Resource: '*'

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aurinara-cloudformation-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  TemplateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}

  ApplicationRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: aurinara/application
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Retain 50 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":50},"action":{"type":"expire"}}]}'

  PythonRunnerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: aurinara/python-runner
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}

  RRunnerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: aurinara/r-runner
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}

Outputs:
  DeploymentRoleArn: {Value: !GetAtt DeploymentRole.Arn}
  CloudFormationExecutionRoleArn: {Value: !GetAtt CloudFormationExecutionRole.Arn}
  TemplateBucketName: {Value: !Ref TemplateBucket}
  ApplicationRepositoryUri: {Value: !GetAtt ApplicationRepository.RepositoryUri}
  PythonRunnerRepositoryUri: {Value: !GetAtt PythonRunnerRepository.RepositoryUri}
  RRunnerRepositoryUri: {Value: !GetAtt RRunnerRepository.RepositoryUri}
