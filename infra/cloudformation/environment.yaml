AWSTemplateFormatVersion: '2010-09-09'
Description: Aurinara environment parent stack. Package this template before deployment.

Parameters:
  Environment:
    Type: String
    AllowedValues: [staging, production]
  DeploymentProfile:
    Type: String
    AllowedValues: [standard, budget]
    Default: standard
  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
  VpcId:
    Type: AWS::EC2::VPC::Id
  AppSubnetIds:
    Type: CommaDelimitedList
  RunnerSubnetIds:
    Type: CommaDelimitedList
  DataSubnetIds:
    Type: CommaDelimitedList
  BaseDomain:
    Type: String
  DnsProvider:
    Type: String
    AllowedValues: [cloudflare, route53]
    Default: cloudflare
  HostedZoneId:
    Type: String
    Default: ''
  CertificateArn:
    Type: String
  ApplicationImage:
    Type: String
    AllowedPattern: '^.+@sha256:[a-f0-9]{64}$'
  MigrationApplicationImage:
    Type: String
    AllowedPattern: '^.+@sha256:[a-f0-9]{64}$'
  ActivateServices:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  PythonRunnerImage:
    Type: String
    AllowedPattern: '^.+@sha256:[a-f0-9]{64}$'
  RRunnerImage:
    Type: String
    AllowedPattern: '^.+@sha256:[a-f0-9]{64}$'
  PlatformPrivateUrl:
    Type: String
  PlatformAuthorizationMode:
    Type: String
    AllowedValues: [shadow, enforced]
    Default: shadow
  PlatformPublicUrl:
    Type: String
  PlatformEventBusName:
    Type: String
  SharedIdentityKeyArn:
    Type: String
  UserPoolId:
    Type: String
  SpaClientId:
    Type: String
  JwtIssuer:
    Type: String
  JwtJwksUrl:
    Type: String
  ServiceClientId:
    Type: String
  ServiceClientSecretArn:
    Type: String
  ServiceTokenUrl:
    Type: String
  OidcEndSessionUrl:
    Type: String
  SharedAlbArn: {Type: String}
  SharedAlbDnsName: {Type: String}
  SharedAlbFullName: {Type: String}
  SharedAlbListenerArn: {Type: String}
  SharedAlbSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  SharedWebAclArn: {Type: String}
  SharedVpcOriginId: {Type: String}
  AlarmEmail:
    Type: String
    Default: ''
  DatabaseInstanceClass:
    Type: String
    Default: db.m7g.large

Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  IsBudget: !Equals [!Ref DeploymentProfile, budget]

Rules:
  Route53HostedZoneRequired:
    RuleCondition: !Equals [!Ref DnsProvider, route53]
    Assertions:
      - Assert: !Not [!Equals [!Ref HostedZoneId, '']]
        AssertDescription: HostedZoneId is required when DnsProvider is route53.

Resources:
  Network:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: network.yaml
      Parameters:
        Environment: !Ref Environment
        VpcCidr: !Ref VpcCidr
        VpcId: !Ref VpcId
        AppSubnetIds: !Join [',', !Ref AppSubnetIds]
        RunnerSubnetIds: !Join [',', !Ref RunnerSubnetIds]
        DataSubnetIds: !Join [',', !Ref DataSubnetIds]
        DeploymentProfile: !Ref DeploymentProfile
        SharedAlbSecurityGroupId: !Ref SharedAlbSecurityGroupId

  Data:
    Type: AWS::CloudFormation::Stack
    DependsOn: Network
    Properties:
      TemplateURL: data.yaml
      Parameters:
        Environment: !Ref Environment
        DataSubnetIds: !GetAtt Network.Outputs.DataSubnetIds
        DatabaseSecurityGroupId: !GetAtt Network.Outputs.DatabaseSecurityGroupId
        EfsSecurityGroupId: !GetAtt Network.Outputs.EfsSecurityGroupId
        DatabaseInstanceClass: !Ref DatabaseInstanceClass
        DeploymentProfile: !Ref DeploymentProfile

  Compute:
    Type: AWS::CloudFormation::Stack
    DependsOn: [Network, Data]
    Properties:
      TemplateURL: compute.yaml
      Parameters:
        Environment: !Ref Environment
        DeploymentProfile: !Ref DeploymentProfile
        VpcId: !GetAtt Network.Outputs.VpcId
        AppSubnetIds: !GetAtt Network.Outputs.AppSubnetIds
        RunnerSubnetIds: !GetAtt Network.Outputs.RunnerSubnetIds
        AlbSubnetIds: !GetAtt Network.Outputs.AppSubnetIds
        AlbSecurityGroupId: !GetAtt Network.Outputs.AlbSecurityGroupId
        ApiSecurityGroupId: !GetAtt Network.Outputs.ApiSecurityGroupId
        WorkerSecurityGroupId: !GetAtt Network.Outputs.WorkerSecurityGroupId
        RunnerSecurityGroupId: !GetAtt Network.Outputs.RunnerSecurityGroupId
        IntegrationSecurityGroupId: !GetAtt Network.Outputs.IntegrationSecurityGroupId
        ArtifactBucketName: !GetAtt Data.Outputs.ArtifactBucketName
        AccessLogBucketName: !GetAtt Data.Outputs.AccessLogBucketName
        DataKeyArn: !GetAtt Data.Outputs.DataKeyArn
        SharedIdentityKeyArn: !Ref SharedIdentityKeyArn
        DatabaseEndpoint: !GetAtt Data.Outputs.DatabaseEndpoint
        DatabaseSecretArn: !GetAtt Data.Outputs.DatabaseSecretArn
        ApplicationSecretArn: !GetAtt Data.Outputs.ApplicationSecretArn
        EfsFileSystemId: !GetAtt Data.Outputs.EfsFileSystemId
        EfsAccessPointId: !GetAtt Data.Outputs.EfsAccessPointId
        ProjectionQueueUrl: !GetAtt Data.Outputs.ProjectionQueueUrl
        ProjectionQueueArn: !GetAtt Data.Outputs.ProjectionQueueArn
        QueueKeyArn: !GetAtt Data.Outputs.QueueKeyArn
        ApplicationImage: !Ref ApplicationImage
        MigrationApplicationImage: !Ref MigrationApplicationImage
        ActivateServices: !Ref ActivateServices
        PythonRunnerImage: !Ref PythonRunnerImage
        RRunnerImage: !Ref RRunnerImage
        UserPoolClientId: !Ref SpaClientId
        JwtIssuer: !Ref JwtIssuer
        JwtJwksUrl: !Ref JwtJwksUrl
        ServiceClientId: !Ref ServiceClientId
        ServiceClientSecretArn: !Ref ServiceClientSecretArn
        ServiceTokenUrl: !Ref ServiceTokenUrl
        PlatformPrivateUrl: !Ref PlatformPrivateUrl
        PlatformAuthorizationMode: !Ref PlatformAuthorizationMode
        ApplicationOrigin: !Sub
          - https://${Host}.${BaseDomain}
          - Host: !If [IsProduction, nara, staging]
        SharedAlbArn: !Ref SharedAlbArn
        SharedAlbDnsName: !Ref SharedAlbDnsName
        SharedAlbFullName: !Ref SharedAlbFullName
        SharedAlbListenerArn: !Ref SharedAlbListenerArn

  Edge:
    Type: AWS::CloudFormation::Stack
    DependsOn: Compute
    Properties:
      TemplateURL: edge.yaml
      Parameters:
        Environment: !Ref Environment
        ApplicationDomain: !Sub
          - ${Host}.${BaseDomain}
          - Host: !If [IsProduction, nara, staging]
        DnsProvider: !Ref DnsProvider
        HostedZoneId: !Ref HostedZoneId
        CertificateArn: !Ref CertificateArn
        FrontendBucketName: !GetAtt Data.Outputs.FrontendBucketName
        FrontendBucketRegionalDomainName: !GetAtt Data.Outputs.FrontendBucketRegionalDomainName
        AccessLogBucketDomainName: !GetAtt Data.Outputs.AccessLogBucketDomainName
        AlbArn: !GetAtt Compute.Outputs.AlbArn
        AlbDnsName: !GetAtt Compute.Outputs.AlbDnsName
        SharedWebAclArn: !If [IsBudget, !Ref SharedWebAclArn, '']
        SharedVpcOriginId: !If [IsBudget, !Ref SharedVpcOriginId, '']
        OriginRoutingValue: aurinara

  Operations:
    Type: AWS::CloudFormation::Stack
    DependsOn: [Compute, Edge]
    Properties:
      TemplateURL: operations.yaml
      Parameters:
        Environment: !Ref Environment
        DeploymentProfile: !Ref DeploymentProfile
        AlarmEmail: !Ref AlarmEmail
        ClusterName: !GetAtt Compute.Outputs.ClusterName
        ApiServiceName: !GetAtt Compute.Outputs.ApiServiceName
        AlbFullName: !GetAtt Compute.Outputs.AlbFullName
        ApiTargetGroupFullName: !GetAtt Compute.Outputs.ApiTargetGroupFullName
        DatabaseIdentifier: !GetAtt Data.Outputs.DatabaseIdentifier
        ProjectionQueueName: !GetAtt Data.Outputs.ProjectionQueueName
        ProjectionDlqName: !GetAtt Data.Outputs.ProjectionDlqName
        BackupVaultName: !GetAtt Data.Outputs.BackupVaultName
        DistributionId: !GetAtt Edge.Outputs.DistributionId

  PlatformEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub aurinara-${Environment}-platform-events
      EventBusName: !Ref PlatformEventBusName
      State: ENABLED
      EventPattern: {source: [aurinara.platform]}
      Targets: [{Id: aurinara-projection, Arn: !GetAtt Data.Outputs.ProjectionQueueArn}]

  ProjectionQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!GetAtt Data.Outputs.ProjectionQueueUrl]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PlatformPublish
            Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt Data.Outputs.ProjectionQueueArn
            Condition: {ArnEquals: {'aws:SourceArn': !GetAtt PlatformEventRule.Arn}}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: !GetAtt Data.Outputs.ProjectionQueueArn
            Condition: {Bool: {'aws:SecureTransport': false}}

Outputs:
  ApplicationUrl:
    Value: !Sub
      - 'https://${Host}.${BaseDomain}'
      - Host: !If [IsProduction, nara, staging]
  PlatformPublicUrl: {Value: !Ref PlatformPublicUrl}
  DeploymentProfile: {Value: !Ref DeploymentProfile}
  UserPoolId: {Value: !Ref UserPoolId}
  SpaClientId: {Value: !Ref SpaClientId}
  OidcAuthority: {Value: !Ref JwtIssuer}
  OidcLogoutUrl:
    Value: !Sub
      - 'https://${Host}.${BaseDomain}/login'
      - Host: !If [IsProduction, nara, staging]
  OidcEndSessionUrl: {Value: !Ref OidcEndSessionUrl}
  FrontendBucketName: {Value: !GetAtt Data.Outputs.FrontendBucketName}
  CloudFrontDistributionId: {Value: !GetAtt Edge.Outputs.DistributionId}
  CloudFrontDistributionDomainName: {Value: !GetAtt Edge.Outputs.DistributionDomainName}
  ClusterName: {Value: !GetAtt Compute.Outputs.ClusterName}
  MigrationTaskDefinitionArn: {Value: !GetAtt Compute.Outputs.MigrationTaskDefinitionArn}
  AppSubnetIds: {Value: !GetAtt Network.Outputs.AppSubnetIds}
  WorkerSecurityGroupId: {Value: !GetAtt Network.Outputs.WorkerSecurityGroupId}
