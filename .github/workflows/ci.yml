name: repository-ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: repository-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: uv sync --extra dev
      - run: uv run ruff check src workers tests
      - name: Type-check deployment and worker boundaries
        run: >-
          uv run mypy
          src/app/config.py src/app/database.py
          src/app/common/logging.py src/app/common/metrics.py
          src/app/artifacts/storage.py src/app/execution
          src/app/platform/authorization.py src/app/integration/delivery.py
          scripts/cloudflare_dns.py workers
      - run: uv run pytest tests/unit tests/contract
      - name: Require one Alembic head
        run: test "$(uv run alembic heads | wc -l)" -eq 1
      - name: Audit locked production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file audit-requirements.txt
          uvx pip-audit --no-deps --disable-pip -r audit-requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run api:sync
        working-directory: frontend
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/api/generated
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install cfn-lint
      - run: cfn-lint -i W1100 W1101 W3002 W3005 W3045 -- infra/cloudformation/*.yaml
      - name: Build application and runner images without publishing
        run: |
          docker build -t aurinara-ci:application .
          docker build -f runners/python/Dockerfile -t aurinara-ci:python-runner .
          docker build -f runners/r/Dockerfile -t aurinara-ci:r-runner .
